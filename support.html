<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pumpi Support</title>

  <style>
    body{
      margin:0;
      background:#111108;
      color:#f5e8c0;
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:24px;
    }

    .card{
      max-width:520px;
      width:100%;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:24px;
      padding:32px;
    }

    h1{
      margin:0 0 8px;
      font-size:32px;
    }

    p{
      line-height:1.7;
      color:#cfc2a0;
    }

    a{
      color:#f0b84a;
      text-decoration:none;
    }

    .emoji{
      font-size:52px;
      margin-bottom:12px;
    }

    .section{
      margin-top:24px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="emoji">🍑</div>

    <h1>Pumpi Support</h1>

    <p>
      Need help with Pumpi?
      Contact us anytime and we’ll get back to you as soon as possible.
    </p>

    <div class="section">
      <strong>Email</strong>
      <p>
        <a href="mailto:lalisforoni@gmail.com">
          lalisforoni@gmail.com
        </a>
      </p>
    </div>

    <div class="section">
      <strong>About Pumpi</strong>
      <p>
        Pumpi is a workout tracking app focused on progress,
        motivation, consistency and training with friends.
      </p>
    </div>
  </div>

</body>
</html>
